services:
  - type: web
    name: jarvis-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AUTH_TOKEN
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: CARTESIA_VOICE_ID
        sync: false
      - key: NTFY_SERVER
        value: https://ntfy.sh
      - key: NTFY_TOPIC
        sync: false
